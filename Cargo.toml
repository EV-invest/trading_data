cargo-features = ["codegen-backend"]

[workspace]
members = [
    "examples/live",
    "examples/simple",
    "examples/spl",
    "trading_data",
    "trading_data_core",
    "trading_data_dag",
    "trading_data_derivatives",
    "trading_data_expr",
    "trading_data_macros",
    "trading_data_persistence",
]
# the published set: `cargo release` selects these, and a release of the facade alone would name
# path deps at a version crates.io does not have. The examples stay out — they reach for sibling
# repos by path.
default-members = [
    "trading_data",
    "trading_data_core",
    "trading_data_dag",
    "trading_data_derivatives",
    "trading_data_expr",
    "trading_data_macros",
    "trading_data_persistence",
]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-invest/trading_data"
readme = "README.md"
keywords = ["trading", "finance", "market-data"]
categories = ["command-line-utilities"]

[workspace.lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow" # tries to make me add a newline after a list in docs

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unused_features = "allow"

[workspace.dependencies]
# The `version` is what a published manifest carries once cargo strips the `path`; without it the
# crate cannot be published at all. One shared version across the seven, so a release is one bump.
trading_data_core = { path = "trading_data_core", version = "0.5.1" }
trading_data_dag = { path = "trading_data_dag", version = "0.5.1" }
trading_data_derivatives = { path = "trading_data_derivatives", version = "0.5.1" }
trading_data_expr = { path = "trading_data_expr", version = "0.5.1" }
trading_data_macros = { path = "trading_data_macros", version = "0.5.1" }
trading_data_persistence = { path = "trading_data_persistence", version = "0.5.1" }

anyhow = "1"
arrayvec = "0.7"
arrow = "59"
clap = { version = "^4.6.5", features = ["derive", "env"] }
color-eyre = "^0.6.5"
derive-new = "0"
derive_more = "2.1"
exchange_interactions = { path = "../exchange_interactions/exchange_interactions" }
# The examples attach it to their own graph and run its server on their own runtime; its `web`
# feature (the wasm front-end) is never enabled from here.
exec_viz = { path = "../exec_viz/exec_viz" }
eyre = "0.6"
flate2 = "1"
iai-callgrind = "0.16"
indicatif = "0.18"
insta = "^1"
jiff = { version = "^0.2", features = ["serde"] }
libm = "0.2"
miette = { version = "^7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2", default-features = false }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2", default-features = false }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2", default-features = false }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2", default-features = false }
nautilus-persistence-macros = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2" }
parquet = "59"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
snapshot_fonts = { version = "1.3", path = "../../snapshot_fonts" }
strum = "0.28"
syn = { version = "^3", features = ["full", "extra-traits"] }
tempfile = "3"
thiserror = "^2.0"
tokio = { version = "^1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "^0.1"
trading_data = { path = "trading_data" } # re-export for the examples, the only members naming it; leave unpinned, a `version` here duplicates the crate's own
ui_test = "0.30"
ureq = "^3"
v_utils = { version = "^2.18", features = ["io", "macros", "cli", "distributions"] }

# A separate profile, so `release` stays bit-for-bit what it is. `debug = 1` is line tables only —
# enough for `perf`/`samply` to name a frame, and no `force-frame-pointer`, which would need
# `RUSTFLAGS` and silently drop `.cargo/config.toml`'s mold linker; `--call-graph dwarf` unwinds
# instead.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[patch.crates-io]
# `trading_data_core` dev-depends on `snapshot_fonts`, and `exchange_interactions` names it from crates-io;
# `[patch]` is only honored from the top-level workspace, so the redirect has to live here or those
# graphs resolve to an incompatible second copy of the shared parse-boundary types.
trading_data_core = { path = "trading_data_core" }
trading_data_dag = { path = "trading_data_dag" } # same, for `exec_viz`
v_utils = { path = "/home/v/s/v_utils/v_utils" } # TEMPORARY: until v_utils 2.18.0 (`fuzz`) is published
