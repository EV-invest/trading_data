cargo-features = ["codegen-backend"]

[workspace]
members = [
    "examples/demo",
    "examples/live",
    "trading_data",
    "trading_data_core",
    "trading_data_dag",
    "trading_data_derivatives",
    "trading_data_macros",
    "trading_data_persistence",
]
default-members = ["trading_data"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-invest/trading_data"
readme = "README.md"
keywords = ["trading", "finance", "market-data"]
categories = ["command-line-utilities"]

[workspace.lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow" # tries to make me add a newline after a list in docs

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unused_features = "allow"

[workspace.dependencies]
arrow = "59"
clap = { version = "^4.6.2", features = ["derive"] }
color-eyre = "^0.6.5"
derive-new = "^0"
# The examples attach it to their own graph and run its server on their own runtime; its `web`
# feature (the wasm front-end) is never enabled from here.
exec_viz = { path = "../exec_viz/exec_viz" }
flate2 = "^1"
iai-callgrind = "0.16"
jiff = "^0.2"
miette = { version = "^7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
parquet = { version = "59", features = ["arrow", "snap", "zstd"] }
proc-macro2 = "^1"
quote = "^1"
serde_json = "^1"
syn = { version = "^2", features = ["full", "extra-traits"] }
tempfile = "3"
thiserror = "^2.0"
tokio = { version = "^1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "^0.1"
trading_data = { path = "trading_data", version = "0.3.0" }
trading_data_core = { path = "trading_data_core", version = "0.3.0" }
trading_data_dag = { path = "trading_data_dag", version = "0.3.0" }
trading_data_derivatives = { path = "trading_data_derivatives", version = "0.3.0" }
trading_data_macros = { path = "trading_data_macros", version = "0.1.0" }
trading_data_persistence = { path = "trading_data_persistence", version = "0.3.0" }
ui_test = "0.30"
ureq = "^3"
v_exchanges = { path = "../../v_exchanges/v_exchanges" }
v_utils = { version = "^2.15.57", features = ["io", "macros", "cli", "distributions"] }

[patch.crates-io]
v_utils = { path = "../../v_utils/v_utils" }
# examples/live pulls v_exchanges by path; v_exchanges names `trading_data`/`trading_data_core` from
# crates-io, and `[patch]` is only honored from the top-level workspace — so redirect them to our
# local crates here, or shared types (BookUpdate, BatchTrades) split into incompatible copies.
trading_data = { path = "trading_data" }
trading_data_core = { path = "trading_data_core" }
