cargo-features = ["codegen-backend"]

[workspace]
members = ["trading_data", "trading_data_macros"]
default-members = ["trading_data"]
resolver = "3"

[workspace.lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow" # tries to make me add a newline after a list in docs

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unused_features = "allow"

[workspace.dependencies]
arrow = "58"
clap = { version = "^4.5.4", features = ["derive"] }
color-eyre = "^0.6.5"
derive-new = "^0"
iai-callgrind = "0.16"
jiff = "^0.2"
miette = { version = "^7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
parquet = { version = "58", features = ["arrow", "snap", "zstd"] }
proc-macro2 = "^1"
quote = "^1"
syn = { version = "^2", features = ["full", "extra-traits"] }
tempfile = "3"
thiserror = "^2.0"
tokio = { version = "^1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "^0.1"
trading_data_macros = { path = "trading_data_macros", version = "0.1.0" }
v_exchanges = { path = "../../v_exchanges/v_exchanges" }
v_utils = { version = "^2.15.0", features = ["io", "macros", "cli"] }

[patch.crates-io]
v_utils = { path = "../../v_utils/v_utils" }
