[package]
name = "trading_data"
version = "0.4.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "Trading data collection and processing"
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-invest/trading_data"
documentation = "https://docs.rs/trading_data"
readme = "../README.md"
keywords = ["trading", "finance", "market-data"]
categories = ["finance"]

# Forwarded, not re-invented: an example depends on this facade only, and the switch it needs is the
# engine's. Off by default here too — an implementor who never asks cannot acquire it by accident.
[features]
profile = ["trading_data_dag/profile"]

[dependencies]
trading_data_core.workspace = true
trading_data_dag.workspace = true
trading_data_derivatives.workspace = true
trading_data_expr.workspace = true
trading_data_persistence.workspace = true
# a period is wiring vocabulary now: `Bars<TF>` is named by whoever wires it, and a consumer reaching
# only through this facade still has to spell a `Timeframe`.
v_utils.workspace = true

[lints]
workspace = true
