[package]
name = "trading_data"
version = "0.2.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "Trading data collection and processing"
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-invest/trading_data"
documentation = "https://docs.rs/trading_data"
readme = "../README.md"
keywords = ["trading", "finance", "market-data"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
arrow.workspace = true
clap.workspace = true
color-eyre.workspace = true
derive-new.workspace = true
jiff.workspace = true
miette.workspace = true
parquet.workspace = true
thiserror.workspace = true
tracing.workspace = true
trading_data_macros.workspace = true
v_utils.workspace = true

[dev-dependencies]
iai-callgrind.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[bench]]
name = "write_throughput"
harness = false

[lints]
workspace = true
