[package]
name = "trading_data"
description = "Trading data collection and processing"
documentation = "https://docs.rs/trading_data"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*"]

# Forwarded, not re-invented: an example depends on this facade only, and the switch it needs is the
# engine's. Off by default here too — an implementor who never asks cannot acquire it by accident.
[features]
profile = ["trading_data_dag/profile"]
# The measurement tier: probe, counters, intent digest, `Census`, and the `Hist` bridge the benches
# need. Anyone building on the facade can ask for it — debugging the generated graph is not a thing
# only this repo does. Off by default, so a build that never asks never pays.
bench = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
trading_data_core.workspace = true
trading_data_dag.workspace = true
trading_data_derivatives.workspace = true
trading_data_expr.workspace = true
trading_data_persistence.workspace = true
# a period is wiring vocabulary now: `Bars<TF>` is named by whoever wires it, and a consumer reaching
# only through this facade still has to spell a `Timeframe`.
v_utils.workspace = true

[dev-dependencies]
insta.workspace = true
# the facade's own `pub use` lists, and the sub-crate signatures they reach, read as syntax rather
# than as text: the invariants under test are about types, and a regex over them is a guess.
syn = { workspace = true, features = ["visit"] }
# the fuzz binary records a `Live` session to a throwaway catalog and replays it back
tempfile.workspace = true
# the FRNG/minimizer/corpus kernel the fuzz binary is a target table over. A separate dev-dep entry
# rather than a feature on the normal one: under `resolver = "3"` that keeps `fuzz` out of the
# published facade's feature set.
v_utils = { workspace = true, features = ["fuzz"] }

# One integration binary, per matklad's "delete cargo integration tests": every fuzz target shares one
# FRNG kernel, one corpus and one driver, and a target is a line in its registry.
[[test]]
name = "fuzz"
path = "tests/fuzz/main.rs"

[lints]
workspace = true
