[package]
name = "trading_data_spl"
description = "Full scam_pump_liqs port: 32 days of Bybit TAO-USDT through the graph, screener → classification → deprecator"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
autobenches = false

# Forwarded from the facade so `measure flame` can ask the app it profiles for it. Off by default,
# and never in a `default` set: without it the attribute is absent from the source the compiler sees.
[features]
profile = ["trading_data/profile"]

[dependencies]
clap.workspace = true
exchange_interactions.workspace = true
exec_viz.workspace = true
indicatif.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
trading_data.workspace = true
ureq.workspace = true
v_utils.workspace = true

# The benches replay this same strategy on NautilusTrader to measure what the DAG buys over an
# actor/msgbus. Pinned to the rev scam_pump_liqs' lock names, so the comparison is against the
# NT the original actually runs on.
[dev-dependencies]
# `DataActor`'s callbacks and the `#[custom_data]` expansion both name it.
anyhow = { workspace = true }
nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2", default-features = false }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2", default-features = false }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2", default-features = false }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2", default-features = false }
nautilus-persistence-macros = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "d5e550feeb175e2695055f372936715dc2011de2" }
trading_data = { workspace = true, features = ["bench"] }

# the gate the other three rest on: our nodes called by hand must produce the graph's intent stream.
[[bench]]
name = "equivalence"
harness = false

[[bench]]
name = "td_graph"
harness = false

[[bench]]
name = "naive_nt"
harness = false

[[bench]]
name = "optimized_nt"
harness = false

[lints]
workspace = true
