[package]
name = "trading_data_simple"
description = "One day, one root, one RSI chain: the cheap graph to answer framework questions against"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Forwarded from the facade so `measure flame` can ask the app it profiles for it. Off by default,
# and never in a `default` set: without it the attribute is absent from the source the compiler sees.
[features]
profile = ["trading_data/profile"]

[dependencies]
clap.workspace = true
exec_viz.workspace = true
# Named rather than inherited: `parquet` is what turns `zlib-rs` on today, and every trade archive
# we inflate rides on that staying true. Dropping to the `miniz_oxide` default would be silent.
flate2 = { workspace = true, features = ["zlib-rs"] }
jiff.workspace = true
tokio.workspace = true
trading_data = { workspace = true }
ureq.workspace = true
v_utils.workspace = true

[lints]
workspace = true
