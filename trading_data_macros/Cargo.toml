[package]
name = "trading_data_macros"
description = "macros for trading_data"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn.workspace = true

# Named by path rather than inherited: the workspace entries carry a `version`, and `trading_data_dag`
# depends on this crate, so a versioned dev-dep here would be a publish-order cycle. Cargo drops
# version-less dev-deps from the packaged manifest.
[dev-dependencies]
insta.workspace = true
trading_data_dag = { path = "../trading_data_dag" }
trading_data_expr = { path = "../trading_data_expr" }
ui_test = { workspace = true }

[[test]]
name = "compile_fail"
path = "tests/compile_fail.rs"
harness = false

[lints]
workspace = true
