[package]
name = "trading_data_macros"
version = "0.2.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "macros for trading_data"
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-invest/trading_data"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn.workspace = true

# Version-less on purpose: `trading_data_dag` depends on this crate, so a versioned dev-dep would be
# a publish-order cycle. Cargo drops version-less dev-deps from the packaged manifest.
[dev-dependencies]
insta.workspace = true
trading_data_dag = { workspace = true }
trading_data_expr = { workspace = true }
ui_test = { workspace = true }

[[test]]
name = "compile_fail"
path = "tests/compile_fail.rs"
harness = false

[lints]
workspace = true
