[package]
name = "trading_data_expr"
description = "Typed primitive algebra: one expression value read four ways — evaluate, differentiate, document, debug"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/lib.rs"]

[dependencies]
# `sqrt`/`exp` are std-only on `f64`; this crate stays `no_std`, so the two transcendentals come
# from the reference libm rather than from dropping the bound.
libm = { workspace = true }

[dev-dependencies]
iai-callgrind.workspace = true

[[bench]]
name = "algebra"
harness = false

[lints]
workspace = true
